[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

[dev]
  # "#custom": request diteruskan ke Vite dulu, rewrite SPA di bawah hanya dipakai kalau Vite 404.
  # Tanpa ini netlify dev menulis ulang modul Vite (/src/*.tsx, /@vite/*) ke dist/index.html.
  framework = "#custom"
  command = "npm run dev"
  targetPort = 5173
  port = 8888

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
